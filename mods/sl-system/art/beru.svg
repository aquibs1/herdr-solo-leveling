<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="94"/></clipPath>
    <radialGradient id="aura" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#3a2a9e" stop-opacity="0.5"/>
      <stop offset="0.85" stop-color="#14205a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050b1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6a3dff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#040309"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a57bff"/>
      <stop offset="0.5" stop-color="#3fd0ff"/>
      <stop offset="1" stop-color="#a57bff"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c4a6ff"/>
      <stop offset="0.8" stop-color="#7b4dff"/>
      <stop offset="1" stop-color="#3a2a9e"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="97" fill="#04081a"/>
  <g clip-path="url(#disc)">
    <circle cx="100" cy="100" r="97" fill="url(#aura)"/>

    <!-- wings: two pairs, spread behind -->
    <path d="M90 104 C66 80 40 54 18 46 C30 72 46 94 84 116 Z" fill="url(#wing)" stroke="#a57bff" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M110 104 C134 80 160 54 182 46 C170 72 154 94 116 116 Z" fill="url(#wing)" stroke="#a57bff" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M88 118 C64 112 40 110 20 118 C40 128 62 130 86 126 Z" fill="url(#wing)" opacity="0.7" stroke="#a57bff" stroke-opacity="0.4" stroke-width="0.8"/>
    <path d="M112 118 C136 112 160 110 180 118 C160 128 138 130 114 126 Z" fill="url(#wing)" opacity="0.7" stroke="#a57bff" stroke-opacity="0.4" stroke-width="0.8"/>
    <path d="M86 108 C64 86 44 66 26 54 M114 108 C136 86 156 66 174 54" fill="none" stroke="#c4a6ff" stroke-opacity="0.35" stroke-width="0.8"/>

    <!-- claw arms -->
    <path d="M58 128 C44 140 36 156 34 176 L28 190 L40 180 L44 192 L48 176 C52 160 60 148 70 140 Z" fill="url(#shell)" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M142 128 C156 140 164 156 166 176 L172 190 L160 180 L156 192 L152 176 C148 160 140 148 130 140 Z" fill="url(#shell)" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- V-shaped armored torso -->
    <path d="M100 112 C82 112 66 118 56 128 L64 150 C72 168 82 186 88 200 L112 200 C118 186 128 168 136 150 L144 128 C134 118 118 112 100 112 Z" fill="url(#shell)" stroke="url(#rim)" stroke-width="1.6"/>
    <!-- spiked pauldrons -->
    <path d="M70 120 L42 104 L52 120 L38 124 L58 132 Z" fill="#0b0820" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M130 120 L158 104 L148 120 L162 124 L142 132 Z" fill="#0b0820" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- chevron plates -->
    <path d="M74 132 L100 144 L126 132 M78 148 L100 160 L122 148 M84 164 L100 176 L116 164 M90 180 L100 188 L110 180" fill="none" stroke="#7b4dff" stroke-opacity="0.8" stroke-width="1.4"/>
    <path d="M100 116 L100 200" stroke="#3fd0ff" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- antennae -->
  <path d="M90 66 C84 46 72 30 54 22" fill="none" stroke="#a57bff" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 66 C116 46 128 30 146 22" fill="none" stroke="#a57bff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="22" r="2.4" fill="#7fe6ff"/>
  <circle cx="146" cy="22" r="2.4" fill="#7fe6ff"/>

  <!-- head: narrow insect skull -->
  <path d="M100 58 C84 58 76 70 78 84 C80 98 90 108 100 116 C110 108 120 98 122 84 C124 70 116 58 100 58 Z" fill="url(#shell)" stroke="#7b4dff" stroke-width="1.5"/>
  <path d="M100 60 L100 74" stroke="#a57bff" stroke-opacity="0.6" stroke-width="1"/>
  <path d="M84 64 L76 52 L88 60 L92 48 L96 59 L100 44 L104 59 L108 48 L112 60 L124 52 L116 64 Z" fill="url(#shell)" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- compound eyes, angled -->
  <path d="M79 74 L97 84 L94 92 L82 88 Z" fill="url(#eye)"/>
  <path d="M121 74 L103 84 L106 92 L118 88 Z" fill="url(#eye)"/>
  <path d="M84 79 L94 84" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M116 79 L106 84" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="88" cy="83" rx="13" ry="10" fill="#a57bff" opacity="0.15"/>
  <ellipse cx="112" cy="83" rx="13" ry="10" fill="#a57bff" opacity="0.15"/>

  <!-- mandibles -->
  <path d="M93 104 C86 108 84 116 90 122 C90 116 94 112 97 110 Z" fill="#0b0820" stroke="#c4a6ff" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M107 104 C114 108 116 116 110 122 C110 116 106 112 103 110 Z" fill="#0b0820" stroke="#c4a6ff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- rings and sparks -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#rim)" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#a57bff" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="34" cy="92" r="1.4" fill="#7fe6ff"/>
  <circle cx="168" cy="92" r="1.6" fill="#c4a6ff"/>
  <circle cx="70" cy="40" r="1" fill="#ffffff"/>
  <circle cx="132" cy="44" r="1.2" fill="#7fe6ff"/>
</svg>
