<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="94"/></clipPath>
    <radialGradient id="aura" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#3a2a9e" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#14205a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#050b1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b1580"/>
      <stop offset="0.6" stop-color="#6a3dff"/>
      <stop offset="1" stop-color="#a57bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d30"/>
      <stop offset="1" stop-color="#030208"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a57bff"/>
      <stop offset="0.5" stop-color="#3fd0ff"/>
      <stop offset="1" stop-color="#a57bff"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#7fe6ff"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- emblem -->
  <circle cx="100" cy="100" r="97" fill="#04081a"/>
  <g clip-path="url(#disc)">
    <circle cx="100" cy="100" r="97" fill="url(#aura)"/>

    <!-- shadow flames rising behind -->
    <path d="M30 200 C26 160 44 150 40 120 C54 138 58 120 56 100 C70 118 70 92 80 76 C84 96 92 90 96 64 C100 84 104 84 106 62 C112 90 118 94 122 76 C130 92 130 118 144 100 C142 120 146 138 160 120 C156 150 174 160 170 200 Z" fill="url(#flame)" opacity="0.85"/>

    <!-- cloak: sloped shoulders, high collar, jagged hem -->
    <path d="M90 108 C76 110 62 118 56 132 C50 146 46 168 40 200 L62 186 L72 200 L86 182 L100 200 L114 182 L128 200 L138 186 L160 200 C154 168 150 146 144 132 C138 118 124 110 110 108 L100 126 Z"
          fill="url(#body)" stroke="url(#rim)" stroke-width="1.6"/>
    <path d="M100 126 L100 200" stroke="#3fd0ff" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M66 140 C70 160 68 178 62 186 M134 140 C130 160 132 178 138 186" fill="none" stroke="#7b4dff" stroke-opacity="0.45" stroke-width="1"/>
    <!-- collar -->
    <path d="M88 108 L74 90 L84 94 L92 112 Z M112 108 L126 90 L116 94 L108 112 Z" fill="#0b0820" stroke="#a57bff" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- crown of shadow -->
  <path d="M80 64 L80 42 L88 54 L93 30 L100 50 L107 30 L112 54 L120 42 L120 64 Z" fill="url(#body)" stroke="#a57bff" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M93 30 L100 50 L107 30" fill="none" stroke="#c4a6ff" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="100" cy="56" r="7" fill="#3fd0ff" opacity="0.22"/>
  <path d="M100 51 L103 56 L100 61 L97 56 Z" fill="#7fe6ff"/>

  <!-- angular face -->
  <path d="M100 62 C88 62 81 70 81 82 C81 94 89 103 100 108 C111 103 119 94 119 82 C119 70 112 62 100 62 Z" fill="url(#body)" stroke="#7b4dff" stroke-width="1.4"/>
  <!-- hair strands -->
  <path d="M82 76 L80 92 L86 82 Z M118 76 L120 92 L114 82 Z M90 64 L84 76 L94 70 Z M110 64 L116 76 L106 70 Z" fill="#0b0820" stroke="#7b4dff" stroke-opacity="0.7" stroke-width="0.8"/>

  <!-- eyes -->
  <ellipse cx="92" cy="85" rx="10" ry="5.5" fill="url(#eye)"/>
  <ellipse cx="108" cy="85" rx="10" ry="5.5" fill="url(#eye)"/>
  <path d="M86 84.5 L97 83 L95 87 Z" fill="#effcff"/>
  <path d="M114 84.5 L103 83 L105 87 Z" fill="#effcff"/>

  <!-- rings and sparks -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#rim)" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#a57bff" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="40" cy="64" r="1.6" fill="#7fe6ff"/>
  <circle cx="162" cy="58" r="1.4" fill="#c4a6ff"/>
  <circle cx="156" cy="96" r="1.8" fill="#7fe6ff"/>
  <circle cx="44" cy="104" r="1.2" fill="#c4a6ff"/>
  <circle cx="136" cy="30" r="1" fill="#ffffff"/>
  <circle cx="62" cy="28" r="1.2" fill="#7fe6ff"/>
</svg>
